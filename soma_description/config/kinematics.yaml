# IK solver per planning group for a future MoveIt2 setup. Kept as a
# reference file, off the roadmap since 2026-10-03: the arms are planar
# chains and the ladder uses the analytic IK of scripts/workspace_map.py.
# KDL because it ships with MoveIt; TRAC-IK would be a one line change.
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
