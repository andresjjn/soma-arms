# IK solver per planning group (MoveIt2, milestone v0.3).
# Starting on KDL because it ships with MoveIt. TRAC-IK is the candidate
# upgrade: better behaved near singularities, and it is a one line change
# in this same file.
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
